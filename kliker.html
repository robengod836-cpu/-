<style>

  .modal {

<body>
  <div class="top-section">
    <h1>🌌 Квантовый <span>Кликер</span></h1>
    <div class="stats-bar">
      <span>Уровень: <b id="prestigeCount">0</b></span>
      <span>Когерентность: <b id="prestigeMult">x1</b></span>
      <span>Запутываний: <b id="totalClicks">0</b></span>
    </div>
    <div class="score"><span id="score">0</span> Ψ</div>
    <div class="cps">Квант/сек: <span id="cps">0</span></div>
    <div class="buff-bar" id="buffBar"></div>
  </div>

  <div class="click-area">
    <div class="offline-banner" id="offlineBanner"></div>
    <button id="clickBtn">ЗАПУТАТЬ!</button>
  </div>

  <div class="bottom-section">
    <div class="tabs">
      <button class="tab active" data-tab="shop">🔬</button>
      <button class="tab" data-tab="ach">🏅<span class="badge" id="achBadge"></span></button>
      <button class="tab" data-tab="leaders">🏆</button>
      <button class="tab" data-tab="stats">📊</button>
      <button class="tab" data-tab="prestige">🌌</button>
      <button class="tab" data-tab="settings">⚙️</button>
    </div>
    <div class="panel" id="panel"></div>
    <button class="reset" onclick="hardReset()">🗑 Полный сброс</button>
  </div>

<script>
/* ============ VK BRIDGE INIT ============ */
let isVK = false;
if (typeof vkBridge !== 'undefined') {
  try {
    vkBridge.send("VKWebAppInit").then(() => { isVK = true; }).catch(() => {});
  } catch(e) {}
}

/* ============ ДАННЫЕ ============ */

/* ============ ЗВУК ============ */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function vibrate(ms) { if (navigator.vibrate && state.sound) { try { navigator.vibrate(ms); } catch(e) {} } }
function beep(freq = 600, dur = 0.06, type = 'sine', vol = 0.08) {
  if (!state.sound) return;
  try {
    initAudio(); if (!audioCtx) return;
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(audioCtx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function quantumSound() { if (!state.sound) return; beep(880 + Math.random() * 400, 0.05, 'sine', 0.06); }
function buySound()      { beep(300, 0.1, 'square', 0.08); setTimeout(() => beep(500, 0.12, 'square', 0.08), 80); }
function achSound()      { [440, 554, 659, 880].forEach((f, i) => setTimeout(() => beep(f, 0.15, 'triangle', 0.1), i * 80)); }
function prestigeSound() { [220, 330, 440, 660, 880].forEach((f, i) => setTimeout(() => beep(f, 0.2, 'sawtooth', 0.1), i * 90)); }
function goldenSound()   { [880, 1320, 1760, 2640].forEach((f, i) => setTimeout(() => beep(f, 0.12, 'square', 0.09), i * 50)); }

/* ============ УТИЛИТЫ ============ */
function format(n) {
  n = Math.floor(n);
  if (n < 1000) return n.toString();
  if (n < 1e6) return (n/1e3).toFixed(n < 1e4 ? 2 : 1) + 'K';
  if (n < 1e9) return (n/1e6).toFixed(n < 1e7 ? 2 : 1) + 'M';
  if (n < 1e12) return (n/1e9).toFixed(2) + 'B';
  if (n < 1e15) return (n/1e12).toFixed(2) + 'T';
  if (n < 1e18) return (n/1e15).toFixed(2) + 'Qa';
  return (n/1e18).toFixed(2) + 'Qi';
}
function cost(u, count = u.count) { return Math.floor(u.baseCost * Math.pow(1.15, count)); }
function totalUpgrades() { return upgrades.reduce((s, u) => s + u.count, 0); }
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function isBuffActive() { return state.buffEndTime > Date.now(); }
function computeCps() {
  let c = 0, p = 1;
  upgrades.forEach(u => { c += u.cps * u.count; p += u.perClick * u.count; });
  baseCps = c;
  const buffMult = isBuffActive() ? state.buffMultiplier : 1;
  return { cps: c * state.prestigeMult * buffMult, clickPower: p * state.prestigeMult * buffMult };
}

/* ============ СОХРАНЕНИЕ ============ */
function save() {
  state.lastOnline = Date.now();
  const data = { state, upgrades: upgrades.map(u => ({ id: u.id, count: u.count })), version: 4 };
  try { localStorage.setItem('quantumClicker', JSON.stringify(data)); } catch(e) {}
}
function load() {
  try {
    const raw = localStorage.getItem('quantumClicker');
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (data.state) Object.assign(state, data.state);
    if (!state.leaderboard) state.leaderboard = [];
    if (!state.playerName) state.playerName = 'Оператор';
    if (data.upgrades) data.upgrades.forEach(s => { const u = upgrades.find(x => x.id === s.id); if (u) u.count = s.count || 0; });
    return data;
  } catch(e) { return null; }
}

/* ============ ОФФЛАЙН ============ */
function applyOfflineEarnings() {
  if (!state.lastOnline) return;
  const elapsed = Math.min(Date.now() - state.lastOnline, 24 * 3600 * 1000);
  const seconds = elapsed / 1000;
  if (seconds < 30) return;
  updateCps();
  if (baseCps <= 0) return;
  const earned = cps * seconds * 0.5;
  if (earned < 1) return;
  state.score += earned; state.totalEarned += earned;
  const hours = Math.floor(seconds / 3600); const minutes = Math.floor((seconds % 3600) / 60);
  let timeText = hours > 0 ? `${hours} ч ${minutes} мин` : `${minutes} мин`;
  offlineBannerEl.textContent = `🌌 Реактор работал без тебя (${timeText}) и накопил ${format(earned)} Ψ`;
  offlineBannerEl.classList.add('show');
  setTimeout(() => offlineBannerEl.classList.remove('show'), 8000);
}

/* ============ ЕЖЕДНЕВНЫЙ ============ */
function checkDaily() {
  const today = todayStr();
  if (state.lastDailyDate === today) return;
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
  const yStr = `${yesterday.getFullYear()}-${yesterday.getMonth()+1}-${yesterday.getDate()}`;
  if (state.lastDailyDate === yStr) state.dailyStreak++;
  else if (state.lastDailyDate !== today) state.dailyStreak = 1;
  state.lastDailyDate = today; save();
  const rewardIndex = Math.min(state.dailyStreak - 1, DAILY_REWARDS.length - 1);
  const reward = DAILY_REWARDS[rewardIndex] * state.prestigeMult;
  setTimeout(() => showDailyModal(reward), 600);
}
function showDailyModal(reward) {
  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  const days = DAILY_REWARDS.map((r, i) => {
    const dayNum = i + 1; let cls = 'day';
    if (dayNum < state.dailyStreak) cls += ' done';
    else if (dayNum === state.dailyStreak) cls += ' today';
    return `<div class="${cls}">${dayNum}</div>`;
  }).join('');
  modal.innerHTML = `
    <div class="modal">
      <h3>📅 Смена в лаборатории</h3>
      <div class="big">🌌</div>
      <p>День <b style="color:#4dc3ff">${state.dailyStreak}</b> подряд!</p>
      <div class="streak">${days}</div>
      <p class="reward">+${format(reward)} Ψ</p>
      <button id="claimDaily">Забрать</button>
    </div>`;
  document.body.appendChild(modal);
  document.getElementById('claimDaily').addEventListener('click', () => {
    state.score += reward; state.totalEarned += reward;
    goldenSound(); vibrate(50); modal.remove();
    checkAchievements(); render(); save();
  });
}

function spawnGoldenCookie() {
  const el = document.createElement('div');
  el.textContent = '✨';
  const size = Math.max(38, Math.min(window.innerWidth * 0.11, 60));
  el.style.cssText = `position:fixed;font-size:${size}px;cursor:pointer;z-index:1500;
    left:${Math.random()*70+15}%;top:${Math.random()*55+20}%;
    filter:drop-shadow(0 0 20px #4dc3ff) drop-shadow(0 0 40px #6b4dff);
    animation:pulse 0.8s infinite;user-select:none;transition:transform 0.1s;-webkit-tap-highlight-color:transparent;`;
  let handled = false;
  const onClick = (e) => {
    e.preventDefault(); e.stopPropagation(); if (handled) return; handled = true;
    goldenSound(); vibrate(60); state.goldenCookiesClicked++;
    const roll = Math.random();
    if (roll < 0.5) { state.buffEndTime = Date.now() + 30000; state.buffMultiplier = 7; showToast('✨ Квантовая флуктуация! x7 на 30 сек'); }
    else if (roll < 0.8) { updateCps(); const bonus = Math.max(cps * 60, 500) * state.prestigeMult; state.score += bonus; state.totalEarned += bonus; showToast(`✨ Мгновенно +${format(bonus)} Ψ`); }
    else { state.buffEndTime = Date.now() + 10000; state.buffMultiplier = 7; showToast('✨ Квантовый скачок x7 на 10 сек!'); }
    updateCps(); el.remove(); save();
  };
  el.addEventListener('touchstart', onClick, { passive: false });
  el.addEventListener('click', onClick);
  document.body.appendChild(el);
  setTimeout(() => { if (el.parentNode) el.remove(); }, 12000);
}

function submitToLeaderboard(silent = false) {
  const scoreVal = Math.floor(state.totalEarned);
  if (scoreVal <= 0) { if (!silent) showToast('Пока нечего записывать'); return; }
  const entry = {
    name: (state.playerName || 'Аноним').slice(0, 16),
    score: scoreVal,
    prestige: state.prestigeCount,
    date: new Date().toLocaleDateString('ru-RU'),
    ts: Date.now(),
  };
  state.leaderboard.push(entry);
  state.leaderboard.sort((a, b) => b.score - a.score);
  state.leaderboard = state.leaderboard.slice(0, 20);
  state.lastSubmittedScore = scoreVal;
  save();
  if (!silent) { showToast('🏆 Результат записан в таблицу!'); render(); }
}

    html += `<button class="vk-btn" onclick="showVKLeaderboard()" style="background:linear-gradient(135deg,#0077ff,#0050cc);margin-top:6px">🏆 Таблица ВК</button>`;

    html += `<button class="vk-btn" onclick="showVKLeaderboard()" style="background:linear-gradient(135deg,#2a1f4a,#1a142a);color:#8a8ab0;margin-top:6px">🏆 Таблица ВК (только в ВК)</button>`;

    html += '<p style="text-align:center;color:#6a6a8a;font-size:12px;padding:20px">Пока пусто. Стань первым!</p>';

    state.leaderboard.forEach((e, i) => {
      let medal = `${i + 1}.`;
      let cls = 'lb-entry';
      if (i === 0) { medal = '🥇'; cls += ' gold'; }

      else if (i === 2) { medal = '🥉'; cls += ' bronze'; }
      html += `<div class="${cls}">
        <div class="lb-rank">${medal}</div>
        <div class="item-info">
          <div class="lb-name">${escapeHtml(e.name)}</div>
          <div class="lb-meta">${e.prestige} ур. · ${e.date}</div>
        </div>
        <div class="lb-score">${format(e.score)} Ψ</div>
      </div>`;
    });
  }

  panelEl.innerHTML = html;

  const input = document.getElementById('playerNameInput');
  if (input) {
    input.addEventListener('change', () => {
      state.playerName = input.value.trim() || 'Аноним';

    });

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function showVKLeaderboard() {
  if (typeof vkBridge === 'undefined') {
    showToast('Открой игру в ВК, чтобы увидеть таблицу ВК');
    return;
  }
  try {
    const userScore = Math.min(Math.floor(state.totalEarned), 10000000);
    await vkBridge.send("VKWebAppShowLeaderBoardBox", { user_result: userScore });
  } catch (e) {
    showToast('Таблица ВК пока недоступна');
  }
}

async function shareResult() {
  const text = `🌌 Я накопил ${format(state.totalEarned)} Ψ в Квантовом Кликере! Уровень ${state.prestigeCount}. Попробуй побить мой рекорд!`;
  const url = location.href;

  if (typeof vkBridge !== 'undefined' && isVK) {
    try {
      await vkBridge.send("VKWebAppShare", { link: url });
      return;
    } catch (e) {}
  }
  if (navigator.share) {
    try {
      await navigator.share({ title: 'Квантовый Кликер', text, url });
      return;
    } catch (e) {}
  }
  // Фолбэк: копируем
  try {
    await navigator.clipboard.writeText(text + ' ' + url);
    showToast('📋 Скопировано в буфер');
  } catch (e) {
    prompt('Скопируй:', text + ' ' + url);
  }
}

  scoreEl.textContent = format(state.score);
  cpsEl.textContent = format(cps);
  totalClicksEl.textContent = format(state.totalClicks);
  prestigeCountEl.textContent = state.prestigeCount;
  prestigeMultEl.textContent = 'x' + state.prestigeMult.toFixed(2);
  document.body.className = state.theme === 'default' ? '' : 'theme-' + state.theme;
  clickBtn.className = '';
  if (state.currentSkin !== 'default') clickBtn.classList.add('skin-' + state.currentSkin);
  if (isBuffActive()) {
    const left = Math.ceil((state.buffEndTime - Date.now()) / 1000);
    buffBarEl.innerHTML = `<div class="buff">⚡ x${state.buffMultiplier} (${left}с)</div>`;
  } else buffBarEl.innerHTML = '';
  const newAch = achievements.filter(a => !state.unlockedAch[a.id] && a.check(state)).length;
  achBadgeEl.textContent = newAch > 0 ? newAch : '';
  renderPanel();
}

function renderPanel() {
  const scrollTop = panelEl.scrollTop;
  if (activeTab === 'shop') renderShop();
  else if (activeTab === 'ach') renderAch();
  else if (activeTab === 'leaders') renderLeaderboard();
  else if (activeTab === 'stats') renderStats();
  else if (activeTab === 'prestige') renderPrestige();
  else if (activeTab === 'settings') renderSettings();
  if (panelEl.scrollTop === 0 && scrollTop > 0) panelEl.scrollTop = scrollTop;
}

function renderShop() {
  let html = '<h2>🔬 Оборудование лаборатории</h2>';
  html += `<div class="buy-mult">${[1, 10, 100].map(m => `<button class="${buyMult === m ? 'active' : ''}" data-mult="${m}">x${m}</button>`).join('')}</div>`;
  upgrades.forEach(u => {
    let totalPrice = 0;
    for (let i = 0; i < buyMult; i++) totalPrice += cost(u, u.count + i);
    const canAfford = state.score >= totalPrice;
    html += `<div class="item">
      <div class="item-info"><div class="item-name">${u.name} (x${u.count})</div><div class="item-desc">${u.desc}</div></div>
      <button ${canAfford ? '' : 'disabled'} data-id="${u.id}">${format(totalPrice)} Ψ${buyMult > 1 ? ` x${buyMult}` : ''}</button>
    </div>`;
  });
  html += '<h2 style="margin-top:14px">🎨 Оболочки сферы</h2>';
  Object.entries(SKINS).forEach(([id, s]) => {
    const owned = state.unlockedSkins[id];
    const active = state.currentSkin === id;
    html += `<div class="item">
      <div class="item-info"><div class="item-name">${s.name}</div><div class="item-desc">${owned ? (active ? '✅ Установлена' : 'Куплена') : 'Не куплена'}</div></div>
      <button data-skin="${id}" ${(!owned && state.score < s.cost) ? 'disabled' : ''}>
        ${owned ? (active ? 'Выбрана' : 'Выбрать') : `${format(s.cost)} Ψ`}
      </button>
    </div>`;
  });
  panelEl.innerHTML = html;
}

function renderAch() {
  let html = '<h2>🏅 Достижения</h2>';
  const unlockedCount = Object.keys(state.unlockedAch).filter(k => state.unlockedAch[k]).length;
  html += `<p style="text-align:center;color:#6a6a8a;margin-bottom:10px;font-size:11px">Получено: ${unlockedCount} / ${achievements.length}</p>`;
  achievements.forEach(a => {
    const unlocked = state.unlockedAch[a.id];
    html += `<div class="ach ${unlocked ? 'unlocked' : ''}">
      <div class="ach-icon">${a.icon}</div>
      <div><div class="ach-name">${a.name}</div><div class="ach-desc">${a.desc}</div></div>
    </div>`;
  });
  panelEl.innerHTML = html;
}

function renderStats() {
  const seconds = state.totalPlayTime;
  const hours = Math.floor(seconds / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  const unlockedCount = Object.keys(state.unlockedAch).filter(k => state.unlockedAch[k]).length;
  const totalSpent = upgrades.reduce((sum, u) => {
    let s = 0; for (let i = 0; i < u.count; i++) s += Math.floor(u.baseCost * Math.pow(1.15, i));
    return sum + s;
  }, 0);
  let html = '<h2>📊 Статистика</h2>';
  html += `<div class="settings">
    <label>Всего квантов <b>${format(state.totalEarned)} Ψ</b></label>
    <label>Потрачено <b>${format(totalSpent)} Ψ</b></label>
    <label>Запутываний <b>${format(state.totalClicks)}</b></label>
    <label>Средняя мощность <b>${format(baseCps)}/с</b></label>
    <label>Устройств <b>${totalUpgrades()}</b></label>
    <label>Достижений <b>${unlockedCount}/${achievements.length}</b></label>
    <label>Уровней <b>${state.prestigeCount}</b></label>
    <label>Когерентность <b>x${state.prestigeMult.toFixed(2)}</b></label>
    <label>Квантовых искр <b>${state.goldenCookiesClicked}</b></label>
    <label>Серия смен <b>${state.dailyStreak} 🔥</b></label>
    <label>Время в лаборатории <b>${hours}ч ${minutes}м</b></label>
  </div>`;
  const required = 1e6 * Math.pow(10, state.prestigeCount);
  const progress = Math.min(100, (state.totalEarned / required) * 100);
  html += `<h2 style="margin-top:14px">Прогресс уровня</h2>`;
  html += `<div style="background:linear-gradient(135deg,#14102a,#0a0a1a);border:1px solid #2a1f4a;padding:12px;border-radius:10px;margin-bottom:8px">
    <div style="display:flex;justify-content:space-between;font-size:11px;color:#8a8ab0;margin-bottom:5px">
      <span>${format(state.totalEarned)} / ${format(required)}</span><span>${progress.toFixed(1)}%</span>
    </div>
    <div class="progress-bar"><div style="width:${progress}%"></div></div>
  </div>`;
  panelEl.innerHTML = html;
}

function renderPrestige() {
  const required = 1e6 * Math.pow(10, state.prestigeCount);
  const canPrestige = state.totalEarned >= required;
  const gain = Math.floor(Math.sqrt(state.totalEarned / 1e6));
  const newMult = (1 + gain * 0.1).toFixed(2);
  let html = '<h2>🌌 Повышение уровня</h2><div class="prestige">';
  html += `<p>Сбросить прогресс и получить постоянную когерентность.</p>`;
  html += `<p>Текущая когерентность: <b>x${state.prestigeMult.toFixed(2)}</b></p>`;
  html += `<p>Нужно накопить: <b>${format(required)}</b> Ψ</p>`;
  html += `<p>Накоплено: <b>${format(state.totalEarned)}</b> Ψ</p>`;
  html += `<p>Даст когерентность: <b style="color:#6b4dff">x${newMult}</b></p>`;
  html += `<button ${canPrestige ? '' : 'disabled'} onclick="doPrestige()">${canPrestige ? 'Повысить уровень' : 'Недостаточно квантов'}</button>`;
  html += '</div>';
  panelEl.innerHTML = html;
}

function renderSettings() {
  let html = '<h2>⚙️ Настройки</h2><div class="settings">';
  html += `<label>Звук <input type="checkbox" id="optSound" ${state.sound ? 'checked' : ''}></label>`;
  html += `<label>Уведомления <input type="checkbox" id="optAch" ${state.achievementsEnabled ? 'checked' : ''}></label>`;
  html += `<label>Тема <select id="optTheme">${Object.entries(THEMES).map(([k, v]) => `<option value="${k}" ${state.theme === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>`;
  html += `<label>Сбросить серию <button id="optResetDaily" style="background:#d64545;border:none;color:#fff;border-radius:6px;cursor:pointer;font-weight:bold">Сброс</button></label>`;
  html += `<label>Экспорт <button id="optExport" style="background:#2a1f4a;border:none;color:#4dc3ff;border-radius:6px;cursor:pointer;font-weight:bold">Копировать</button></label>`;
  html += `<label>Импорт <button id="optImport" style="background:#2a1f4a;border:none;color:#4dc3ff;border-radius:6px;cursor:pointer;font-weight:bold">Вставить</button></label>`;
  html += '</div>';
  panelEl.innerHTML = html;
  document.getElementById('optSound').addEventListener('change', e => { state.sound = e.target.checked; save(); });
  document.getElementById('optAch').addEventListener('change', e => { state.achievementsEnabled = e.target.checked; save(); });
  document.getElementById('optTheme').addEventListener('change', e => { state.theme = e.target.value; save(); render(); });
  document.getElementById('optResetDaily').addEventListener('click', () => {
    if (confirm('Сбросить серию ежедневных смен?')) { state.dailyStreak = 0; state.lastDailyDate = null; save(); render(); }
  });
  document.getElementById('optExport').addEventListener('click', exportSave);
  document.getElementById('optImport').addEventListener('click', importSave);
}

/* ============ ЭКСПОРТ/ИМПОРТ ============ */
function exportSave() {
  const data = { state, upgrades: upgrades.map(u => ({ id: u.id, count: u.count })) };
  const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(encoded).then(() => showToast('📋 Скопировано в буфер')).catch(() => prompt('Скопируй код:', encoded));
  } else prompt('Скопируй код:', encoded);
}
function importSave() {
  const input = prompt('Вставь код сохранения:');
  if (!input) return;
  try {
    const data = JSON.parse(decodeURIComponent(escape(atob(input))));
    if (data.state) Object.assign(state, data.state);
    if (!state.leaderboard) state.leaderboard = [];
    if (data.upgrades) data.upgrades.forEach(s => { const u = upgrades.find(x => x.id === s.id); if (u) u.count = s.count || 0; });
    updateCps(); render(); save(); showToast('✅ Сохранение загружено');
  } catch(e) { showToast('❌ Неверный код'); }
}

/* ============ КЛИК ============ */
let lastTouchTime = 0;
function handleClick(e) {
  const now = Date.now();
  if (now - lastTouchTime < 50) return;
  lastTouchTime = now;
  initAudio();
  const gain = clickPower;
  state.score += gain; state.totalEarned += gain; state.totalClicks++;
  quantumSound(); vibrate(10);
  let x, y;
  if (e.touches && e.touches[0]) { x = e.touches[0].clientX; y = e.touches[0].clientY; }
  else if (e.changedTouches && e.changedTouches[0]) { x = e.changedTouches[0].clientX; y = e.changedTouches[0].clientY; }
  else { x = e.clientX || window.innerWidth / 2; y = e.clientY || window.innerHeight / 2; }
  spawnSparks(x, y); spawnFloat(x, y, '+' + format(gain));
  checkAchievements(); render();
}
clickBtn.addEventListener('touchstart', (e) => { e.preventDefault(); handleClick(e); }, { passive: false });
clickBtn.addEventListener('click', (e) => { if (Date.now() - lastTouchTime < 300) return; handleClick(e); });

/* ============ ТАБЫ ============ */
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('touchstart', (e) => { e.preventDefault(); activateTab(t); }, { passive: false });
  t.addEventListener('click', () => activateTab(t));
});
function activateTab(t) {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  activeTab = t.dataset.tab;
  panelEl.scrollTop = 0;
  renderPanel();
  vibrate(8);
}

/* ============ ПАНЕЛЬ ============ */
panelEl.addEventListener('click', (e) => handlePanelClick(e));
panelEl.addEventListener('touchstart', (e) => {
  const target = e.target.closest('button');
  if (target) { e.preventDefault(); handlePanelClick(e); }
}, { passive: false });

function handlePanelClick(e) {
  const btn = e.target.closest('button[data-id]');
  if (btn) {
    const u = upgrades.find(x => x.id === btn.dataset.id);
    let totalPrice = 0;
    for (let i = 0; i < buyMult; i++) totalPrice += cost(u, u.count + i);
    if (state.score >= totalPrice) {
      state.score -= totalPrice; u.count += buyMult;
      buySound(); vibrate(15); updateCps(); checkAchievements(); render(); save();
    }
    return;
  }
  const multBtn = e.target.closest('button[data-mult]');
  if (multBtn) { buyMult = parseInt(multBtn.dataset.mult); renderShop(); return; }
  const skinBtn = e.target.closest('button[data-skin]');
  if (skinBtn) {
    const id = skinBtn.dataset.skin; const skin = SKINS[id];
    if (!state.unlockedSkins[id]) {
      if (state.score >= skin.cost) {
        state.score -= skin.cost; state.unlockedSkins[id] = true; state.currentSkin = id;
        buySound(); vibrate(20);
      }
    } else { state.currentSkin = id; beep(700, 0.06); }
    checkAchievements(); render(); save();
  }
}

/* ============ ЭФФЕКТЫ ============ */
function spawnFloat(x, y, text) {
  const el = document.createElement('div');
  el.className = 'float'; el.textContent = text;
  el.style.left = x + 'px'; el.style.top = (y - 20) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 800);
}
function spawnSparks(x, y) {
  const count = 6 + Math.floor(Math.random() * 5);
  for (let i = 0; i < count; i++) {
    const s = document.createElement('div');
    s.className = 'spark'; s.style.left = x + 'px'; s.style.top = y + 'px';
    const angle = Math.random() * Math.PI * 2;
    const dist = 30 + Math.random() * 70;
    const dx = Math.cos(angle) * dist; const dy = Math.sin(angle) * dist;
    const scale = 0.4 + Math.random() * 0.8;
    document.body.appendChild(s);
    s.animate([
      { transform: `translate(-50%, -50%) scale(${scale})`, opacity: 1 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0)`, opacity: 0 }
    ], { duration: 350 + Math.random() * 250, easing: 'cubic-bezier(0.2, 0.8, 0.4, 1)' }).onfinish = () => s.remove();
  }
}
function updateCps() { const c = computeCps(); cps = c.cps; clickPower = c.clickPower; }
function checkAchievements() {
  achievements.forEach(a => {
    if (!state.unlockedAch[a.id] && a.check(state)) {
      state.unlockedAch[a.id] = true;
      if (state.achievementsEnabled) showToast(`${a.icon} ${a.name}: ${a.desc}`);
      achSound(); vibrate(40);
    }
  });
}
function showToast(text) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = text;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 2500);
}

function doPrestige() {
  const required = 1e6 * Math.pow(10, state.prestigeCount);
  if (state.totalEarned < required) return;
  // Записываем рекорд перед сбросом
  submitToLeaderboard(true);
  const gain = Math.floor(Math.sqrt(state.totalEarned / 1e6));
  state.prestigeCount++;
  state.prestigeMult = 1 + gain * 0.1;
  state.score = 0; state.totalEarned = 0;
  upgrades.forEach(u => u.count = 0);
  prestigeSound(); vibrate([50, 50, 100]);
  showToast(`🌌 Уровень повышен! Когерентность x${state.prestigeMult.toFixed(2)}`);
  updateCps(); checkAchievements(); render(); save();
}
function hardReset() {
  if (!confirm('Полностью удалить весь прогресс?')) return;
  localStorage.removeItem('quantumClicker');
  location.reload();
}

/* ============ ЦИКЛ ============ */
let lastTick = Date.now();
setInterval(() => {
  const now = Date.now();
  const dt = (now - lastTick) / 1000;
  lastTick = now;
  state.totalPlayTime += dt;
  if (cps > 0) { const gain = cps * dt; state.score += gain; state.totalEarned += gain; }
  if (state.buffEndTime && state.buffEndTime <= now) { state.buffEndTime = 0; state.buffMultiplier = 1; updateCps(); }
  checkAchievements(); render();
}, 200);

setInterval(() => { updateCps(); save(); }, 3000);

function scheduleGolden() {
  const delay = (60 + Math.random() * 60) * 1000;
  setTimeout(() => { spawnGoldenCookie(); scheduleGolden(); }, delay);
}
scheduleGolden();
setInterval(() => { if (state.lastDailyDate !== todayStr()) checkDaily(); }, 60000);

window.addEventListener('beforeunload', save);
window.addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) save();
  else { applyOfflineEarnings(); checkDaily(); }
});
document.addEventListener('touchstart', function unlockAudio() { initAudio(); document.removeEventListener('touchstart', unlockAudio); }, { once: true, passive: true });
document.addEventListener('click', function unlockAudio2() { initAudio(); document.removeEventListener('click', unlockAudio2); }, { once: true });

/* ============ PWA ============ */
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'quantum-clicker-v4';
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => e.waitUntil(clients.claim()));
    self.addEventListener('fetch', e => {
      e.respondWith(caches.open(CACHE).then(cache =>
        fetch(e.request).then(res => { cache.put(e.request, res.clone()); return res; }).catch(() => cache.match(e.request))
      ));
    });
  `;
  try {
    const blob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
  } catch(e) {}
}

/* ============ СТАРТ ============ */
const loaded = load();
updateCps();
applyOfflineEarnings();
checkDaily();
checkAchievements();
render();
setTimeout(save, 1000);
</script>
</body>
</html>
